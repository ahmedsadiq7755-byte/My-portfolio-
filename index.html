<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <img src="profile.jpeg" alt="Profile Picture" class="profile-img">
    <h1>Hello, I am a Web Developer</h1>
    <p>I know Basic HTML, CSS, and JavaScript.</p>

    <h2>My Skills</h2>
    <ul>
        <li>HTML & CSS</li>
        <li>Basic JavaScript</li>
        <li>Responsive Web Design</li>
    </ul>

    <!-- Contact Section -->
    <div id="contact-section">
        <h2>Contact</h2>
        <p>You can Contact me on :</p>
        <ul>
            <li><a href="https://github.com/ahmedsadiq7755-byte" target="_blank">GitHub</a></li>
            <li><a href="https://linkedin.com" target="_blank">LinkedIn</a></li>
            <li><a href="mailto:ahmed.sadiq7755@gmail.com">ahmed.sadiq7755@gmail.com</a></li>
        </ul>
    </div>

    <h3 id="greeting"></h3>

    <!-- Interactive Button -->
    <button onclick="toggleContact()" id="btn">Hide Contact Details</button>
    
    <br><br>

    <!-- Voice / Mic Section -->
    <button id="mic-btn" onclick="startMic()">🎤 Start Voice</button>
    <p id="voice-output" style="color: blue; font-weight: bold;"></p>

    <script>
        // Toggle Contact Function
        function toggleContact() {
            var contactDiv = document.getElementById("contact-section");
            var btn = document.getElementById("btn");
            if (contactDiv.style.display === "none") {
                contactDiv.style.display = "block";
                btn.innerText = "Hide Contact Details";
            } else {
                contactDiv.style.display = "none";
                btn.innerText = "Show Contact Details";
            }
        }

        // Voice Recognition Function
        function startMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';

                recognition.onstart = function() {
                    document.getElementById("voice-output").innerText = "Listening... Speak now!";
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById("voice-output").innerText = "You said: " + transcript;
                };

                recognition.onerror = function(event) {
                    document.getElementById("voice-output").innerText = "Error: " + event.error;
                };

                recognition.start();
            } else {
                alert("Speech recognition is not supported in this browser.");
            }
        }
    </script>
</body>
</html>
